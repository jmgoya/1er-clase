{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <!-- Bootstrap (estilos) e íconos, desde un CDN: no se instala nada -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'frontend/app.css' %}">
  <!-- Nuestro código va ANTES que Alpine, para que registre "taskflow" a tiempo -->
  <script src="{% static 'frontend/app.js' %}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data="taskflow" x-cloak>

  <!-- ===================== PANTALLA DE LOGIN ===================== -->
  <!-- Ojo: x-show no puede ir junto a "d-flex" (Bootstrap usa !important y le gana) -->
  <div x-show="!access">
  <main class="login-bg d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card shadow-lg border-0 login-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="logo mx-auto mb-2"><i class="bi bi-kanban"></i></div>
          <h1 class="h3 fw-bold mb-0">TaskFlow</h1>
          <small class="text-body-secondary">Tus proyectos, en orden</small>
        </div>

        <ul class="nav nav-pills nav-fill mb-3">
          <li class="nav-item"><button class="nav-link" :class="{active: mode === 'login'}" @click="mode = 'login'">Ingresar</button></li>
          <li class="nav-item"><button class="nav-link" :class="{active: mode === 'register'}" @click="mode = 'register'">Crear cuenta</button></li>
        </ul>

        <form @submit.prevent="mode === 'login' ? login() : register()">
          <div class="form-floating mb-2">
            <input class="form-control" id="u" placeholder="usuario" x-model="form.username" required>
            <label for="u">Usuario</label>
          </div>
          <div class="form-floating mb-2" x-show="mode === 'register'">
            <input class="form-control" id="e" type="email" placeholder="email" x-model="form.email">
            <label for="e">Email</label>
          </div>
          <div class="form-floating mb-3">
            <input class="form-control" id="p" type="password" placeholder="contraseña" x-model="form.password" required>
            <label for="p">Contraseña</label>
          </div>
          <button class="btn btn-primary w-100 py-2" :disabled="loading">
            <span x-show="loading" class="spinner-border spinner-border-sm me-1"></span>
            <span x-text="mode === 'login' ? 'Ingresar' : 'Crear cuenta'"></span>
          </button>
        </form>

        <div class="text-center text-body-secondary my-3 small">o</div>
        <a class="btn btn-outline-secondary w-100" href="/accounts/google/login/?next=%2F%3Fgoogle%3D1">
          <i class="bi bi-google me-1"></i> Ingresar con Google
        </a>
      </div>
    </div>
  </main>
  </div>

  <!-- ===================== APLICACIÓN ===================== -->
  <div x-show="access">
    <nav class="navbar bg-body-tertiary border-bottom sticky-top">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold"><i class="bi bi-kanban text-primary"></i> TaskFlow</span>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" @click="toggleTheme()" title="Modo oscuro">
            <i class="bi" :class="dark ? 'bi-sun' : 'bi-moon-stars'"></i>
          </button>
          <span class="badge rounded-pill text-bg-primary px-3 py-2"><i class="bi bi-person-circle"></i> <span x-text="username"></span></span>
          <button class="btn btn-sm btn-outline-danger" @click="logout()"><i class="bi bi-box-arrow-right"></i> Salir</button>
        </div>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <!-- Barra lateral: proyectos -->
        <aside class="col-md-3 col-lg-2 border-end py-3 sidebar">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="text-uppercase text-body-secondary small mb-0">Proyectos</h6>
            <button class="btn btn-sm btn-link p-0" @click="openProjectForm()" title="Nuevo proyecto"><i class="bi bi-plus-circle fs-5"></i></button>
          </div>
          <div class="list-group list-group-flush">
            <button class="list-group-item list-group-item-action rounded" :class="{active: !filters.project && !overdueOnly}" @click="selectProject(null)">
              <i class="bi bi-collection me-1"></i> Todas las tareas
            </button>
            <button class="list-group-item list-group-item-action rounded" :class="{active: overdueOnly}" @click="showOverdue()">
              <i class="bi bi-alarm me-1"></i> Vencidas
            </button>
            <template x-for="p in projects" :key="p.id">
              <button class="list-group-item list-group-item-action rounded d-flex justify-content-between align-items-center"
                      :class="{active: filters.project == p.id && !overdueOnly}" @click="selectProject(p.id)">
                <span><i class="bi bi-folder2 me-1"></i> <span x-text="p.name"></span></span>
                <span class="badge text-bg-secondary rounded-pill" x-text="p.tasks.length"></span>
              </button>
            </template>
          </div>
          <p class="small text-body-secondary mt-3" x-show="projects.length === 0">Todavía no sos miembro de ningún proyecto. ¡Creá uno!</p>
        </aside>

        <!-- Contenido principal: tareas -->
        <main class="col-md-9 col-lg-10 py-3 px-md-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h4 mb-0" x-text="title()"></h2>
            <button class="btn btn-primary" @click="openTaskForm()"><i class="bi bi-plus-lg"></i> Nueva tarea</button>
          </div>

          <!-- Resumen por estado (cada número es una consulta ?status=...) -->
          <div class="row g-3 mb-3">
            <template x-for="s in STATUSES" :key="s.value">
              <div class="col-4">
                <div class="card stat border-0 shadow-sm" :class="'stat-' + s.value">
                  <div class="card-body py-2">
                    <div class="small text-body-secondary"><i class="bi" :class="s.icon"></i> <span x-text="s.label"></span></div>
                    <div class="fs-3 fw-bold" x-text="stats[s.value] ?? '–'"></div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Filtros: se traducen a ?search=&status=&priority=&ordering= -->
          <div class="row g-2 mb-3" x-show="!overdueOnly">
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input class="form-control" placeholder="Buscar en título o descripción..." x-model="filters.search" @input.debounce.400ms="loadTasks(1)">
              </div>
            </div>
            <div class="col-6 col-md-2">
              <select class="form-select" x-model="filters.status" @change="loadTasks(1)">
                <option value="">Todos los estados</option>
                <template x-for="s in STATUSES"><option :value="s.value" x-text="s.label"></option></template>
              </select>
            </div>
            <div class="col-6 col-md-2">
              <select class="form-select" x-model="filters.priority" @change="loadTasks(1)">
                <option value="">Toda prioridad</option>
                <template x-for="p in PRIORITIES"><option :value="p.value" x-text="p.label"></option></template>
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-select" x-model="filters.ordering" @change="loadTasks(1)">
                <option value="-created_at">Más nuevas primero</option>
                <option value="due_date">Vencen antes</option>
                <option value="-due_date">Vencen más tarde</option>
              </select>
            </div>
          </div>

          <!-- Lista de tareas -->
          <div x-show="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

          <div x-show="!loading && tasks.length === 0" class="text-center text-body-secondary py-5">
            <i class="bi bi-inbox display-4"></i>
            <p class="mt-2">No hay tareas para mostrar.</p>
          </div>

          <div class="row g-3" x-show="!loading">
            <template x-for="t in tasks" :key="t.id">
              <div class="col-md-6 col-xl-4">
                <div class="card h-100 shadow-sm task" :style="'border-left: 5px solid var(--bs-' + priority(t.priority).color + ')'">
                  <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                      <h5 class="card-title mb-1" :class="{'text-decoration-line-through text-body-secondary': t.status === 'completada'}" x-text="t.title"></h5>
                      <div class="dropdown-actions">
                        <button class="btn btn-sm btn-link text-success" title="Completar" x-show="t.status !== 'completada'" @click="complete(t)"><i class="bi bi-check-circle fs-5"></i></button>
                        <button class="btn btn-sm btn-link" title="Editar" @click="openTaskForm(t)"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-link text-danger" title="Borrar" @click="remove(t)"><i class="bi bi-trash"></i></button>
                      </div>
                    </div>
                    <p class="small text-body-secondary mb-2" x-text="projectName(t.project)"></p>
                    <p class="card-text small" x-show="t.description" x-text="t.description"></p>
                    <div class="d-flex flex-wrap gap-1">
                      <span class="badge" :class="'text-bg-' + priority(t.priority).color" x-text="priority(t.priority).label"></span>
                      <span class="badge text-bg-light border" x-text="status(t.status).label"></span>
                      <span class="badge text-bg-light border" x-show="t.due_date"><i class="bi bi-calendar-event"></i> <span x-text="formatDate(t.due_date)"></span></span>
                      <span class="badge text-bg-warning" x-show="t.due_on_holiday" title="La fecha límite cae en un feriado"><i class="bi bi-balloon"></i> Feriado</span>
                      <template x-for="tag in t.tags" :key="tag.id"><span class="badge rounded-pill text-bg-info" x-text="'#' + tag.name"></span></template>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Paginación: usamos los links next / previous que manda DRF -->
          <div x-show="!loading && (page.next || page.previous)">
          <div class="d-flex justify-content-between align-items-center mt-4">
            <button class="btn btn-outline-primary" :disabled="!page.previous" @click="loadTasks(page.number - 1)"><i class="bi bi-chevron-left"></i> Anterior</button>
            <span class="text-body-secondary small">Página <span x-text="page.number"></span> · <span x-text="page.count"></span> tareas</span>
            <button class="btn btn-outline-primary" :disabled="!page.next" @click="loadTasks(page.number + 1)">Siguiente <i class="bi bi-chevron-right"></i></button>
          </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- ===================== MODAL: TAREA ===================== -->
  <template x-if="taskForm">
    <div>
      <div class="modal d-block" @keydown.escape.window="taskForm = null">
        <div class="modal-dialog modal-dialog-centered">
          <form class="modal-content" @submit.prevent="saveTask()">
            <div class="modal-header">
              <h5 class="modal-title" x-text="taskForm.id ? 'Editar tarea' : 'Nueva tarea'"></h5>
              <button type="button" class="btn-close" @click="taskForm = null"></button>
            </div>
            <div class="modal-body">
              <label class="form-label">Proyecto</label>
              <select class="form-select mb-2" x-model="taskForm.project" required>
                <option value="">Elegí un proyecto...</option>
                <template x-for="p in projects"><option :value="p.id" x-text="p.name" :selected="p.id == taskForm?.project"></option></template>
              </select>
              <label class="form-label">Título</label>
              <input class="form-control mb-2" x-model="taskForm.title" required maxlength="200">
              <label class="form-label">Descripción</label>
              <textarea class="form-control mb-2" rows="3" x-model="taskForm.description"></textarea>
              <div class="row g-2">
                <div class="col-6">
                  <label class="form-label">Prioridad</label>
                  <select class="form-select" x-model="taskForm.priority">
                    <template x-for="p in PRIORITIES"><option :value="p.value" x-text="p.label" :selected="p.value === taskForm?.priority"></option></template>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label">Fecha límite</label>
                  <input class="form-control" type="date" x-model="taskForm.due_date">
                </div>
              </div>
              <div class="mt-2" x-show="taskForm.id">
                <label class="form-label">Estado</label>
                <select class="form-select" x-model="taskForm.status">
                  <template x-for="s in STATUSES"><option :value="s.value" x-text="s.label" :selected="s.value === taskForm?.status"></option></template>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" @click="taskForm = null">Cancelar</button>
              <button class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
      <div class="modal-backdrop show"></div>
    </div>
  </template>

  <!-- ===================== MODAL: PROYECTO ===================== -->
  <template x-if="projectForm">
    <div>
      <div class="modal d-block" @keydown.escape.window="projectForm = null">
        <div class="modal-dialog modal-dialog-centered">
          <form class="modal-content" @submit.prevent="saveProject()">
            <div class="modal-header">
              <h5 class="modal-title">Nuevo proyecto</h5>
              <button type="button" class="btn-close" @click="projectForm = null"></button>
            </div>
            <div class="modal-body">
              <label class="form-label">Nombre</label>
              <input class="form-control mb-2" x-model="projectForm.name" required maxlength="150">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" rows="3" x-model="projectForm.description"></textarea>
              <p class="small text-body-secondary mt-2 mb-0"><i class="bi bi-info-circle"></i> Vas a quedar como admin del proyecto (Clase 7).</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" @click="projectForm = null">Cancelar</button>
              <button class="btn btn-primary">Crear</button>
            </div>
          </form>
        </div>
      </div>
      <div class="modal-backdrop show"></div>
    </div>
  </template>

  <!-- ===================== AVISOS (toasts) ===================== -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <template x-for="n in toasts" :key="n.id">
      <div class="toast show align-items-center border-0" :class="n.ok ? 'text-bg-success' : 'text-bg-danger'">
        <div class="d-flex">
          <div class="toast-body"><i class="bi me-1" :class="n.ok ? 'bi-check-circle' : 'bi-exclamation-triangle'"></i> <span x-text="n.text"></span></div>
          <button class="btn-close btn-close-white me-2 m-auto" @click="toasts = toasts.filter(x => x.id !== n.id)"></button>
        </div>
      </div>
    </template>
  </div>
</body>
</html>
